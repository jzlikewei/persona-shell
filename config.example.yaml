agents:
  defaults:
    default: "claude"
    director: "claude"
    explorer: "claude"
    executor: "claude"
    critic: "claude"
    introspector: "claude"
  providers:
    claude:
      type: "claude"
      command: "claude"
      bare: false                          # false = 保留完整工具集（含 Agent 等高级工具）; true = --bare 模式，工具限制为 Bash/Edit/Read
      dangerously_skip_permissions: true
      effort: "max"
      flush_context_limit: 850000          # 可选：覆盖 director.flush_context_limit
      disable_auto_flush: false            # 可选：true 时禁用该 provider 的自动压缩/自动 FLUSH
    codex:
      type: "codex-app-server"
      command: "codex"
      sandbox: "danger-full-access"
      approval: "never"
      search: false
      mcp_mode: "mcp"
      transport: "stdio"
      # cwd: "~/github/jzlikewei/persona-shell" # 可选：让 Codex app 在指定 workspace 下显示 live session
      flush_context_limit: 210000          # 可选：Codex provider 默认上下文刷新阈值
      flush_context_limits:                # 可选：按 model 进一步覆盖
        gpt-5.5: 200000
      disable_auto_flush: false            # 可选：true 时禁用该 provider 的自动压缩/自动 FLUSH
    # system_prompt_file: "prompts/codex.md"  # Per-agent system prompt (relative to persona_dir)
    kimi:
      type: "kimi"
      command: "kimi"
      # agent_file: "kimi-agent.yaml"           # Kimi agent spec (relative to persona_dir)
      # skills_dir: "skills"                    # Kimi skills directory (relative to persona_dir)
      # mcp_config_file: ".mcp.json"            # MCP config file (relative to persona_dir)
      # model: "kimi-k2"                        # Model alias

# 配置模板 — 复制到 config.yaml 并填入实际值
# 飞书凭据（app_id + app_secret）放 im_secret.yaml，不在此文件中
feishu:
  master_id: ""                       # 本体的飞书 open_id（配置后仅本体可执行 /restart 等命令）
  streaming_reply_enabled: false      # 是否启用飞书流式卡片回复
  stream_update_debounce_ms: 2000     # 飞书流式卡片最小刷新间隔兜底，小 chunk 最多等待 2s
  stream_min_update_chars: 64         # 飞书流式卡片累计新增字符达到该值时刷新

director:
  persona_dir: "~/.persona"
  pipe_dir: "/tmp/persona"
  pid_file: "/tmp/persona/director.pid"
  time_sync_interval_hours: 2       # 距上次时间同步超过 N 小时则注入时间前缀
  flush_context_limit: 700000       # 上下文 token 阈值，超过则自动 flush
  flush_interval_days: 7            # 距上次 flush 的最大天数

pool:
  max_directors: 5                  # 最大并发 Director 数（不含主 Director）
  idle_timeout_minutes: 30          # 群聊 Director 空闲超时自动回收（分钟）
  small_group_threshold: 5          # 群成员 ≤ 此值走 DirectorPool，> 此值走 one-shot
  parallel_chat_ids: []             # 配置为"并行模式"的群 chat_id 列表，始终走 DirectorPool 不受人数限制
  # parallel_chat_ids:
  #   - oc_xxxxxxxxxxxxxxxxxxxx     # 示例：话题群用于并行任务
  mention_only_chat_ids: []         # 这些群必须 @bot 才响应，无论群人数（默认空数组）
  # mention_only_chat_ids:
  #   - oc_xxxxxxxxxxxxxxxxxxxx     # 示例：大群只在被 @ 时回复

logging:
  level: "info"                     # debug | info | warn | error
  queue_log: "logs/queue.log"

console:
  enabled: true
  port: 3000
  # token: "your-secret-token"     # 配置后 HTTP API 和 WebSocket 需携带 token 认证
                                    # ⚠️ WebSocket 通过 ?token=xxx query param 传递，勿暴露到公网

task:
  default_timeout_minutes: 30       # 后台任务默认超时
